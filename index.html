<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fa">
  <meta name="description" content="Download the file.">
  <title>File download</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fa;
      --panel: #ffffff;
      --panel-soft: #f9fafc;
      --text: #192230;
      --muted: #697586;
      --line: #e2e7ee;
      --accent: #3867d6;
      --accent-ink: #ffffff;
      --shadow: rgba(27,43,67,.08);
    }
    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--bg); scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Manrope", ui-sans-serif, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    .shell { width: min(1160px, calc(100% - 48px)); margin: 0 auto; }
    .topbar {
      height: 84px; display:flex; align-items:center; justify-content:space-between;
      border-bottom: 1px solid var(--line);
    }
    .brand { display:flex; align-items:center; gap:12px; text-decoration:none; font-weight:800; letter-spacing:-.04em; }
    .brand-mark {
      display:grid; place-items:center; width:38px; height:38px; border-radius:12px;
      background:#eaf0fc; color:var(--accent);
    }
    .brand-mark svg { width:21px; height:21px; }
    .brand-name { font-size:14px; line-height:1.15; }
    .brand-name span { display:block; font-size:10px; margin-top:4px; color:var(--muted); font-family:"DM Mono",monospace; font-weight:400; letter-spacing:.08em; text-transform:uppercase; }
    .nav { display:flex; align-items:center; gap:26px; }
    .nav-link { text-decoration:none; color:var(--muted); font-size:13px; font-weight:700; transition:color .2s; }
    .nav-link:hover { color:var(--text); }
    main { padding:70px 0 74px; }
    .hero {
      display:grid; grid-template-columns:minmax(0,1.08fr) minmax(340px,.92fr); align-items:center;
      gap:clamp(44px,8vw,110px); min-height:470px;
    }
    .eyebrow { display:flex; align-items:center; gap:10px; color:var(--accent); font:500 11px "DM Mono",monospace; letter-spacing:.16em; text-transform:uppercase; }
    .eyebrow::before { content:""; width:26px; height:1px; background:var(--accent); }
    h1 { max-width:620px; margin:24px 0 19px; font-size:clamp(46px,6.4vw,78px); line-height:.99; letter-spacing:-.075em; font-weight:700; }
    h1 em { color:var(--accent); font-style:normal; }
    .intro { max-width:490px; color:var(--muted); font-size:16px; line-height:1.8; margin:0; }
    .hero-meta { display:flex; align-items:center; gap:18px; margin-top:35px; color:var(--muted); font:12px "DM Mono",monospace; }
    .meta-dot { width:4px; height:4px; background:var(--line); border-radius:50%; }
    .download-card {
      position:relative; overflow:hidden; padding:30px; border:1px solid var(--line); border-radius:20px;
      background:linear-gradient(145deg,var(--panel),var(--panel-soft)); box-shadow:0 28px 70px var(--shadow);
    }
    .download-card::after { content:""; position:absolute; z-index:0; top:-90px; right:-105px; width:220px; height:220px; border:1px solid rgba(56,103,214,.08); border-radius:50%; box-shadow:0 0 0 28px rgba(56,103,214,.025),0 0 0 56px rgba(56,103,214,.02); pointer-events:none; }
    .card-top, .card-content { position:relative; z-index:1; }
    .card-top { display:flex; align-items:center; justify-content:space-between; padding-bottom:25px; border-bottom:1px solid var(--line); }
    .card-kicker { color:var(--muted); font:11px "DM Mono",monospace; letter-spacing:.12em; text-transform:uppercase; }
    .ready { display:flex; align-items:center; gap:7px; color:var(--accent); font:11px "DM Mono",monospace; text-transform:uppercase; letter-spacing:.08em; }
    .ready i { display:block; width:6px; height:6px; border-radius:50%; background:var(--accent); box-shadow:0 0 12px var(--accent); }
    .file-visual { display:flex; align-items:center; gap:17px; padding:27px 0 23px; }
    .file-icon { flex:none; width:56px; height:56px; display:grid; place-items:center; border:1px solid var(--line); border-radius:15px; background:#f3f6fb; color:var(--accent); }
    .file-icon svg { width:27px; height:27px; }
    .file-title { margin:0; font-size:16px; font-weight:800; letter-spacing:-.03em; }
    .file-subtitle { margin:6px 0 0; color:var(--muted); font:11px "DM Mono",monospace; }
    .download {
      position:relative; isolation:isolate; display:flex; width:100%; min-height:56px; align-items:center; justify-content:center; gap:11px;
      overflow:hidden; border:0; border-radius:11px; background:var(--accent); color:var(--accent-ink);
      text-decoration:none; font-size:14px; font-weight:800; transition:transform .18s,filter .18s;
    }
    .download:hover { transform:translateY(-2px); filter:brightness(1.05); }
    .download:active { transform:translateY(0) scale(.99); }
    .download svg { width:19px; height:19px; }
    .download:focus-visible,.nav-link:focus-visible,.source:focus-visible { outline:3px solid #58bdf0; outline-offset:4px; }
    .progress { position:absolute; z-index:-1; inset:0 auto 0 0; width:0; background:rgba(255,255,255,.28); transition:width .2s linear; }
    .download.indeterminate .progress { width:34%; animation:slide 1.2s ease-in-out infinite; }
    .download-status { min-height:20px; margin:12px 0 0; color:var(--muted); text-align:center; font:10px "DM Mono",monospace; }
    .card-bottom { display:flex; justify-content:space-between; align-items:center; gap:15px; margin-top:23px; padding-top:20px; border-top:1px solid var(--line); }
    .version-label { color:var(--muted); font:10px "DM Mono",monospace; letter-spacing:.09em; text-transform:uppercase; }
    .version-value { display:block; margin-top:5px; color:var(--text); font:12px "DM Mono",monospace; }
    .source { display:inline-flex; align-items:center; gap:7px; color:var(--text); text-decoration:none; font-size:12px; font-weight:700; }
    .source svg { width:15px; height:15px; color:var(--muted); }
    .source:hover { color:var(--accent); }
    .details { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:64px; }
    .detail { min-height:112px; padding:21px 22px; border:1px solid var(--line); border-radius:14px; background:var(--panel); }
    .detail-index { color:var(--accent); font:11px "DM Mono",monospace; }
    .detail h2 { margin:13px 0 5px; font-size:13px; letter-spacing:-.02em; }
    .detail p { margin:0; color:var(--muted); font-size:11px; line-height:1.6; }
    footer { border-top:1px solid var(--line); }
    .footer-inner { min-height:72px; display:flex; justify-content:space-between; align-items:center; gap:20px; color:var(--muted); font:10px "DM Mono",monospace; }
    .footer-right { display:flex; align-items:center; gap:8px; }
    .footer-right span { color:var(--accent); }
    @keyframes slide { from{transform:translateX(-110%)} to{transform:translateX(310%)} }
    @media (max-width:800px) {
      .hero { grid-template-columns:1fr; gap:44px; min-height:0; }
      .hero-copy { max-width:670px; }
      .download-card { max-width:540px; width:100%; }
      main { padding-top:58px; }
      .details { margin-top:42px; }
    }
    @media (max-width:560px) {
      .shell { width:min(100% - 34px,1160px); }
      .topbar { height:70px; }
      .nav { gap:13px; }
      .nav-link { display:none; }
      main { padding:46px 0 50px; }
      h1 { font-size:clamp(46px,13vw,65px); margin-top:20px; }
      .intro { font-size:14px; }
      .hero-meta { margin-top:25px; gap:12px; font-size:10px; }
      .download-card { padding:22px; border-radius:17px; }
      .details { grid-template-columns:1fr; gap:10px; margin-top:32px; }
      .detail { min-height:0; padding:17px 19px; }
      .detail h2 { margin-top:8px; }
      .footer-inner { min-height:66px; font-size:9px; }
    }
    @media (prefers-reduced-motion:reduce) {
      *,*::before,*::after { scroll-behavior:auto !important; animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
    }
  </style>
</head>
<body>
  <header class="shell topbar">
    <a class="brand" href="#top" aria-label="Download Center home">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m-5-5 5 5 5-5M5 20h14"/></svg></span>
      <span class="brand-name">File download<span>Ready to save</span></span>
    </a>
  </header>
  <main class="shell" id="top">
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-copy">
        <div class="eyebrow">File download</div>
        <h1 id="hero-title">Your file is <em>ready.</em></h1>
        <p class="intro">Select the button to download the file to your device.</p>
      </div>
      <section class="download-card" aria-label="Download application">
        <div class="card-top"><span class="card-kicker">Download file</span><span class="ready"><i aria-hidden="true"></i>Available</span></div>
        <div class="card-content">
          <div class="file-visual">
            <div class="file-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M13 2v7h7M8 14h8M8 18h5"/></svg></div>
            <div><p class="file-title">Your file</p><p class="file-subtitle">Release-Project-Win64.zip</p></div>
          </div>
          <a id="download-btn" class="download" href="https://github.com/mrhouibi/atm-management-system/releases/download/Release/Release-Project-Win64.zip" download>
            <span class="progress" aria-hidden="true"></span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M5 20h14"/></svg>
            <span id="download-label">Download file</span>
          </a>
          <p class="download-status" id="download-status" aria-live="polite">ZIP archive</p>
        </div>
      </section>
    </section>
  </main>
  <footer><div class="shell footer-inner"><span>FILE DOWNLOAD</span><span class="footer-right">ZIP archive</span></div></footer>
  <script>
    (function () {
      const FILE_URL = "https://github.com/mrhouibi/atm-management-system/releases/download/Release/Release-Project-Win64.zip";
      const FILE_NAME = "Release-Project-Win64.zip";
      const btn = document.getElementById("download-btn");
      const bar = btn.querySelector(".progress");
      const label = document.getElementById("download-label");
      const status = document.getElementById("download-status");
      let started = false;

      function saveUrl(href) {
        const link = document.createElement("a");
        link.href = href;
        link.download = FILE_NAME;
        document.body.appendChild(link);
        link.click();
        link.remove();
      }
      function fallback() {
        btn.classList.add("indeterminate");
        label.textContent = "Downloading…";
        status.textContent = "Your download is starting";
        saveUrl(FILE_URL);
      }
      async function start() {
        if (started) return;
        started = true;
        btn.classList.add("indeterminate");
        label.textContent = "Preparing download…";
        status.textContent = "Connecting to the release";
        try {
          const response = await fetch(FILE_URL);
          if (!response.ok || !response.body) throw new Error("Download unavailable");
          const total = Number(response.headers.get("Content-Length")) || 0;
          const reader = response.body.getReader();
          const chunks = [];
          let received = 0;
          for (;;) {
            const {done, value} = await reader.read();
            if (done) break;
            chunks.push(value);
            received += value.length;
            if (total) {
              btn.classList.remove("indeterminate");
              const ratio = Math.min(received / total, 1);
              bar.style.width = Math.round(ratio * 100) + "%";
              label.textContent = Math.round(ratio * 100) + "% downloaded";
              status.textContent = "Downloading release package";
            }
          }
          btn.classList.remove("indeterminate");
          bar.style.width = "100%";
          label.textContent = "Download complete";
          status.textContent = FILE_NAME;
          const objectUrl = URL.createObjectURL(new Blob(chunks));
          saveUrl(objectUrl);
          setTimeout(() => URL.revokeObjectURL(objectUrl), 60000);
        } catch (_) { fallback(); }
      }
      btn.addEventListener("click", function (event) { event.preventDefault(); start(); });
    })();
  </script>
</body>
</html>
